<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" ry="6" fill="#2D6A4F"/>
  <!-- Horizontal lines: middle is longest and touches the arrow at x=23 -->
